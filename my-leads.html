<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Leads | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="lead-queue.html">Assigned Queue</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="loan-rates.html">Loan Rates</a><a href="government-schemes.html">Schemes</a><a href="executive-profile.html">Profile</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow" id="leadEyebrow">Private lead workspace</div><h1 id="pageTitle">My Leads</h1><p id="pageIntro">Created by you or assigned to your account.</p></div><a class="btn primary" href="new-lead.html" data-policy-key="addLead">+ Add Lead</a></div>
<div class="filter-bar"><label id="adminScopeWrap" hidden>Lead View<select id="adminScope"><option value="mine">My Leads</option><option value="all">All Leads</option><option value="assigned">Assigned Leads</option><option value="unassigned">Unassigned Leads</option></select></label><label>Search<input id="leadSearch" placeholder="Customer, mobile, lead ID, source"></label><label>Stage<select id="stageFilter"><option value="">All stages</option></select></label><label>Status<select id="statusFilter"><option value="">All statuses</option></select></label><button class="btn ghost" id="clearFilters" type="button">Clear</button></div>
<div id="leadTable" class="dashboard-panel">Loading…</div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;const data=await HCCRM.myLeads(),sf=stageFilter,st=statusFilter,q=leadSearch,scopeSel=document.getElementById('adminScope'),scopeWrap=document.getElementById('adminScopeWrap'),params=new URLSearchParams(location.search),owner=params.get('ownerUid')||'',statusQ=params.get('status')||'',stageQ=params.get('stage')||'';let scope=params.get('scope')||(owner?'all':'mine');if(profile.role==='admin'){scopeWrap.hidden=false;scopeSel.value=['mine','all','assigned','unassigned'].includes(scope)?scope:'mine'}else scope='mine';HCCRM.stages.forEach(x=>sf.add(new Option(x,x)));HCCRM.statuses.forEach(x=>st.add(new Option(x,x)));if(statusQ)st.value=statusQ;if(stageQ)sf.value=stageQ;function sourceText(x){if(x.source==='Bulk Google Sheet'||x.source==='Bulk Import')x.source='BGS';return[x.source,x.sourceRef].filter(Boolean).join(' · ')||'—'}function adminScopeMatch(x){if(profile.role!=='admin')return true;const s=scopeSel.value||scope;if(s==='all')return true;if(s==='assigned')return!!x.assignedToUserId;if(s==='unassigned')return!x.assignedToUserId;return x.assignedToUserId===profile.uid||x.createdByUserId===profile.uid}function setHeading(){if(profile.role!=='admin')return;const s=scopeSel.value||scope,t={mine:['My Leads','Leads assigned to you or created by your administrator account.'],all:['All Leads','Administrator monitoring view for every lead.'],assigned:['Assigned Leads','All leads currently assigned to an Executive, Connector or Admin.'],unassigned:['Unassigned Leads','Leads waiting to be assigned.']}[s]||['My Leads',''];pageTitle.textContent=t[0];pageIntro.textContent=owner?'Filtered records for the selected user.':t[1];leadEyebrow.textContent='Administrator lead workspace'}function render(){setHeading();const term=q.value.toLowerCase(),a=data.filter(x=>adminScopeMatch(x)&&(!owner||x.assignedToUserId===owner||x.createdByUserId===owner)&&(!sf.value||x.stage===sf.value)&&(!st.value||x.status===st.value)&&(!term||[x.id,x.customerName,x.mobile,x.loanType,x.source,x.sourceRef,x.assignedToExecutiveId,x.createdByExecutiveId].join(' ').toLowerCase().includes(term)));leadTable.innerHTML=a.length?`<div class="rate-table-wrap"><table class="rate-table"><thead><tr><th>Lead ID</th><th>Customer</th><th>Mobile</th><th>Designation</th><th>Pincode</th><th>Loan</th><th>Sourced from</th><th>Assigned To</th><th>Stage</th><th>Status</th><th>Follow-up</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${HCCRM.esc(x.id)}</td><td>${HCCRM.esc(x.customerName||'')}</td><td>${HCCRM.esc(x.mobile||'')}</td><td>${HCCRM.esc(x.designation||'—')}</td><td>${HCCRM.esc(x.pincode||'—')}</td><td>${HCCRM.esc(x.loanType||'')}</td><td>${HCCRM.esc(sourceText(x))}</td><td>${HCCRM.esc(x.assignedToExecutiveId||'Unassigned')}</td><td>${HCCRM.esc(x.stage||'Enquiry')}</td><td>${HCCRM.esc(x.status||'New')}</td><td>${HCCRM.esc(x.nextFollowUp||'—')}</td><td><a class="btn ghost small" href="lead-details.html?id=${encodeURIComponent(x.id)}">Open</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><h3>No matching leads</h3><p>Try changing the view or filters.</p></div>'}q.oninput=render;sf.onchange=render;st.onchange=render;if(scopeSel)scopeSel.onchange=()=>{scope=scopeSel.value;const u=new URL(location.href);u.searchParams.set('scope',scope);u.searchParams.delete('ownerUid');history.replaceState(null,'',u.pathname+'?'+u.searchParams.toString());render()};clearFilters.onclick=()=>{q.value='';sf.value='';st.value='';if(profile.role==='admin'){scopeSel.value='mine';scope='mine'}history.replaceState(null,'','my-leads.html');render()};render()})();</script><script src="nav-shared.js"></script><script src="site-ads.js"></script><script src="app-shell.js"></script></body></html>
