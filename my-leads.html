<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Leads | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="home.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="executive-dashboard.html">Dashboard</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="executive-profile.html">Profile</a></nav></div></header><main><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Private executive area</div><h1>My Leads</h1><p>Created by you or assigned to your account.</p></div><a class="btn primary" href="new-lead.html">+ Add Lead</a></div><div class="filter-bar"><label>Search<input id="leadSearch" placeholder="Customer, mobile, lead ID"></label><label>Stage<select id="stageFilter"><option value="">All stages</option></select></label><label>Status<select id="statusFilter"><option value="">All statuses</option></select></label></div><div id="leadTable" class="dashboard-panel">Loading…</div></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Hello Customer Fintech Solutions</span><span>Your lead access is enforced by Firestore security rules.</span></div></footer><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script>(async()=>{if(!HCAuth.ready)return;const {user}=await HCAuth.guard();const data=await HCCRM.myLeads(user.uid);const sf=document.getElementById('stageFilter'),st=document.getElementById('statusFilter'),q=document.getElementById('leadSearch');HCCRM.stages.forEach(x=>sf.insertAdjacentHTML('beforeend',`<option>${x}</option>`));HCCRM.statuses.forEach(x=>st.insertAdjacentHTML('beforeend',`<option>${x}</option>`));function render(){const term=q.value.toLowerCase();const a=data.filter(x=>(!sf.value||x.stage===sf.value)&&(!st.value||x.status===st.value)&&(!term||[x.id,x.customerName,x.mobile,x.loanType].join(' ').toLowerCase().includes(term)));document.getElementById('leadTable').innerHTML=a.length?`<div class="rate-table-wrap"><table class="rate-table"><thead><tr><th>Lead ID</th><th>Customer</th><th>Mobile</th><th>Loan</th><th>Stage</th><th>Status</th><th>Follow-up</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${HCCRM.esc(x.id)}</td><td>${HCCRM.esc(x.customerName||'')}</td><td>${HCCRM.esc(x.mobile||'')}</td><td>${HCCRM.esc(x.loanType||'')}</td><td>${HCCRM.esc(x.stage||'Enquiry')}</td><td>${HCCRM.esc(x.status||'New')}</td><td>${HCCRM.esc(x.nextFollowUp||'—')}</td><td><a class="btn ghost small" href="lead-details.html?id=${encodeURIComponent(x.id)}">Open</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><h3>No matching leads</h3><p>Try changing the filters or add a new lead.</p></div>'}q.addEventListener('input',render);sf.addEventListener('change',render);st.addEventListener('change',render);render()})();</script></body></html>
