<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Leads | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="lead-queue.html">Assigned Queue</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="loan-rates.html">Loan Rates</a><a href="government-schemes.html">Schemes</a><a href="executive-profile.html">Profile</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow" id="leadEyebrow">Private lead workspace</div><h1 id="pageTitle">My Leads</h1><p id="pageIntro">Created by you or assigned to your account.</p></div><a class="btn primary" href="new-lead.html" data-policy-key="addLead">+ Add Lead</a></div>
<div class="filter-bar"><label id="adminScopeWrap" hidden>Lead View<select id="adminScope"><option value="mine">My Leads</option><option value="all">All Leads</option><option value="assigned">Assigned Leads</option><option value="unassigned">Unassigned Leads</option></select></label><label>Search<input id="leadSearch" placeholder="Customer, mobile, lead ID, source"></label><label>Stage<select id="stageFilter"><option value="">All stages</option></select></label><label>Status<select id="statusFilter"><option value="">All statuses</option></select></label><button class="btn ghost" id="clearFilters" type="button">Clear</button></div>
<div id="leadTable" class="dashboard-panel">Loading…</div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;
const sf=stageFilter,st=statusFilter,q=leadSearch,scopeSel=document.getElementById('adminScope'),scopeWrap=document.getElementById('adminScopeWrap'),params=new URLSearchParams(location.search),owner=params.get('ownerUid')||'',statusQ=params.get('status')||'',stageQ=params.get('stage')||'';let scope=params.get('scope')||(owner?'all':'mine'),page=1,pageSize=25,total=0,data=[];
const defs=[['id','Lead ID'],['customerName','Customer Name'],['mobile','Mobile Number'],['loanType','Loan Type'],['stage','Stage'],['status','Status'],['email','Email'],['designation','Designation'],['pincode','Pincode'],['address','Address'],['salary','Income / Salary'],['loanAmount','Loan Amount'],['source','Sourced From'],['assignedToExecutiveId','Assigned To'],['createdByExecutiveId','Created By'],['nextFollowUp','Follow-up'],['followUpTimeBand','Follow-up Time'],['hasEmis','Has EMIs'],['emiCount','EMI Count'],['totalExistingEmi','Existing EMI Total'],['hasCreditCards','Credit Cards'],['creditCardCount','Card Count'],['totalCreditCardEmi','Card EMI Total'],['totalCreditCardOutstanding','Card Outstanding'],['hasCibilIssue','CIBIL / Credit Issue'],['updatedAt','Last Updated']];
const defaultCols=['id','customerName','mobile','loanType','stage','status'];let selected=JSON.parse(localStorage.getItem('hcLeadColumns')||'null')||defaultCols.slice();
columnChooser.innerHTML=defs.map(([k,l])=>`<label class="permission-item"><input type="checkbox" data-col="${k}" ${selected.includes(k)?'checked':''}><span>${l}</span></label>`).join('');
toggleColumns.onclick=()=>{columnChooser.hidden=!columnChooser.hidden;columnActions.hidden=columnChooser.hidden};applyColumns.onclick=()=>{selected=[...document.querySelectorAll('[data-col]:checked')].map(x=>x.dataset.col);if(!selected.length)selected=defaultCols.slice();localStorage.setItem('hcLeadColumns',JSON.stringify(selected));render()};defaultColumns.onclick=()=>{selected=defaultCols.slice();document.querySelectorAll('[data-col]').forEach(x=>x.checked=selected.includes(x.dataset.col));localStorage.setItem('hcLeadColumns',JSON.stringify(selected));render()};
if(profile.role==='admin'){scopeWrap.hidden=false;scopeSel.value=['mine','all','assigned','unassigned'].includes(scope)?scope:'mine'}else scope='mine';HCCRM.stages.forEach(x=>sf.add(new Option(x,x)));HCCRM.statuses.forEach(x=>st.add(new Option(x,x)));if(statusQ)st.value=statusQ;if(stageQ)sf.value=stageQ;
function sourceText(x){return[x.source==='Bulk Google Sheet'||x.source==='Bulk Import'?'BGS':x.source,x.sourceRef].filter(Boolean).join(' · ')||'—'}
function value(x,k){if(k==='source')return sourceText(x);if(['salary','loanAmount','totalExistingEmi','totalCreditCardEmi','totalCreditCardOutstanding'].includes(k)&&x[k])return '₹'+Number(x[k]).toLocaleString('en-IN');return x[k]??'—'}
function setHeading(){if(profile.role!=='admin')return;const s=scopeSel.value||scope,z={mine:['My Leads','Leads assigned to you or created by your administrator account.'],all:['All Leads','Administrator monitoring view for every lead.'],assigned:['Assigned Leads','All leads currently assigned to a user.'],unassigned:['Unassigned Leads','Leads waiting to be assigned.']}[s]||['My Leads',''];pageTitle.textContent=z[0];pageIntro.textContent=owner?'Filtered records for the selected user.':z[1];leadEyebrow.textContent='Administrator lead workspace'}
async function load(){leadTable.innerHTML='<div class="empty-state"><span class="btn-spinner"></span><h3>Loading leads…</h3></div>';const d=await HCCRM.api('myLeadsPage',{page,pageSize,scope:scopeSel?.value||scope,ownerUid:owner,stage:sf.value,status:st.value,q:q.value});data=d.leads||[];total=d.total||0;render()}
function render(){setHeading();leadTable.innerHTML=data.length?`<div class="rate-table-wrap"><table class="rate-table"><thead><tr>${selected.map(k=>`<th>${HCCRM.esc(defs.find(d=>d[0]===k)?.[1]||k)}</th>`).join('')}<th>Action</th></tr></thead><tbody>${data.map(x=>`<tr>${selected.map(k=>`<td>${HCCRM.esc(value(x,k))}</td>`).join('')}<td><a class="btn ghost small" href="lead-details.html?id=${encodeURIComponent(x.id)}">Open</a></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><h3>No matching leads</h3><p>Try changing the view or filters.</p></div>';const pages=Math.max(1,Math.ceil(total/pageSize));leadPager.innerHTML=`<span>${total} lead(s) · Page ${page} of ${pages}</span><div><button class="btn ghost small" id="prevLeadPage" ${page<=1?'disabled':''}>← Previous</button> <button class="btn ghost small" id="nextLeadPage" ${page>=pages?'disabled':''}>Next →</button></div>`;prevLeadPage.onclick=()=>{if(page>1){page--;load()}};nextLeadPage.onclick=()=>{if(page<pages){page++;load()}}}
let timer;q.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},350)};sf.onchange=st.onchange=()=>{page=1;load()};if(scopeSel)scopeSel.onchange=()=>{scope=scopeSel.value;page=1;load()};clearFilters.onclick=()=>{q.value='';sf.value='';st.value='';if(profile.role==='admin'){scopeSel.value='mine';scope='mine'}page=1;load()};await load()})();</script><script src="nav-shared.js"></script><script src="site-ads.js"></script><script src="app-shell.js"></script></body></html>
