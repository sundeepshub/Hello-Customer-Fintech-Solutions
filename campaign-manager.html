<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Manager | Hello Customer</title><link rel="stylesheet" href="style.css"></head><body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="my-leads.html">My Leads</a><a href="campaign-manager.html">Campaigns</a><a href="social-publisher.html">Social Publisher</a><a href="ai-marketing-studio.html">AI Studio</a><button class="btn primary small" id="logout">Logout</button></nav></div></header><main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Marketing operations</div><h1>Campaign Manager</h1><p>Plan, track and reuse loan campaigns with a campaign ID that flows into Guest Access leads.</p></div></div><div class="dashboard-grid"><form id="campaignForm" class="dashboard-panel"><input type="hidden" name="id"><h2>Create / Edit Campaign</h2><div class="fields two"><label>Campaign Name *<input name="name" required maxlength="120"></label><label>Loan Type<select name="loanType"><option>Personal Loan</option><option>Home Loan</option><option>Business Loan</option><option>Loan Against Property</option><option>Education Loan</option><option>Vehicle Loan</option><option>Balance Transfer / Consolidation</option><option>Project Funds</option></select></label><label>Primary Platform<select name="platform"><option>Facebook</option><option>Instagram</option><option>YouTube</option><option>ShareChat</option><option>WhatsApp</option><option>Multi-platform</option></select></label><label>Objective<select name="objective"><option>Lead Generation</option><option>Awareness</option><option>Rate Reference</option><option>Referral</option><option>Follow-up</option></select></label><label>Audience<input name="audience" maxlength="180"></label><label>Budget (₹)<input name="budget" type="number" min="0"></label><label>Start Date<input name="startDate" type="date"></label><label>End Date<input name="endDate" type="date"></label><label>Status<select name="status"><option>Draft</option><option>Planned</option><option>Active</option><option>Paused</option><option>Completed</option></select></label><label class="full">Notes<textarea name="notes" rows="3"></textarea></label></div><div class="action-bar"><button class="btn primary" type="submit">Save Campaign</button><button class="btn ghost" type="button" id="resetCampaign">Clear</button></div><div id="campaignMsg" class="auth-message"></div></form><div class="dashboard-panel"><h2>Campaigns</h2><div id="campaignList">Loading…</div></div></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script><script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;if(profile.role!=='admin'&&profile.permissions?.campaignManager===false){document.querySelector('main').innerHTML='<section class="section"><div class="container"><div class="access-denied"><h2>Campaign Manager is not enabled for your account.</h2></div></div></section>';return}let data=[];const f=campaignForm,esc=HCCRM.esc;async function load(){data=(await HCCRM.api('campaignList')).campaigns||[];render()}function render(){campaignList.innerHTML=data.length?data.map(x=>`<div class="stage-row"><span><b>${esc(x.name)}</b><small>${esc(x.id)} · ${esc(x.platform)} · ${esc(x.status)} · ${esc(x.loanType)}</small></span><span class="action-bar"><button class="btn ghost small edit" data-id="${x.id}">Edit</button><a class="btn ghost small" href="social-publisher.html?campaign=${encodeURIComponent(x.id)}">Publish</a><button class="btn ghost small delete" data-id="${x.id}">Delete</button></span></div>`).join(''):'<div class="empty-state"><h3>No campaigns yet</h3><p>Create a campaign to connect marketing activity with tracked leads.</p></div>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{const x=data.find(y=>y.id===b.dataset.id);Object.keys(x).forEach(k=>{if(f.elements[k])f.elements[k].value=x[k]??''});scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this campaign?'))return;HCUI.setLoading(b,true,'Deleting…');try{await HCCRM.api('campaignDelete',{id:b.dataset.id});await load()}catch(e){HCUI.toast(e.message,'error')}})}f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type=submit]');if(f.endDate.value&&f.startDate.value&&f.endDate.value<f.startDate.value)return HCUI.message(campaignMsg,'End date cannot be before the start date.','error');HCUI.setLoading(b,true,'Saving…');try{await HCCRM.api('campaignSave',Object.fromEntries(new FormData(f).entries()));HCUI.message(campaignMsg,'Campaign saved successfully and backend updated.','ok');f.reset();await load()}catch(x){HCUI.message(campaignMsg,x.message,'error')}finally{HCUI.setLoading(b,false)}};resetCampaign.onclick=()=>f.reset();await load()})();</script><script src="nav-shared.js"></script><script src="app-shell.js"></script></body></html>
