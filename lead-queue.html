<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assigned Lead Queue | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="lead-queue.html">Assigned Queue</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="social-publisher.html">Social Publisher</a><a href="executive-profile.html">Profile</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Admin-assigned leads</div><h1>Assigned Lead Queue</h1><p>Only leads assigned to your account by the administrator appear in this queue.</p></div><div class="queue-counter" id="counter">0 / 0</div></div><div id="queueMessage" class="auth-message"></div><div id="queueCard" class="portal-card">Loading assigned leads…</div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;let page=1,pageSize=25,total=0,leads=[],i=0;const esc=HCCRM.esc,done=['Closed','Disbursed','Rejected','Not Interested'];
async function loadPage(p){page=p;queueCard.innerHTML='<div class="empty-state"><span class="btn-spinner"></span><h3>Loading assigned leads…</h3></div>';const d=await HCCRM.assignedLeadsPage(page,pageSize);total=d.total||0;leads=(d.leads||[]).filter(x=>!done.includes(x.status));i=0;show()}
function field(label,v){return `<div class="lead-field"><span>${label}</span><b>${esc(v===0?'0':(v||'—'))}</b></div>`}
function show(){const globalIndex=(page-1)*pageSize+i+1;counter.textContent=leads.length?globalIndex+' / '+total:'0 / '+total;if(!leads.length){queueCard.innerHTML=`<div class="empty-state"><h3>No active assigned leads on this page</h3><p>${total?'Move to another page or refresh the queue.':'Leads assigned by the administrator will appear here.'}</p><div class="action-bar">${page>1?'<button class="btn ghost" id="prevPage">← Previous Page</button>':''}${page*pageSize<total?'<button class="btn primary" id="nextPage">Next Page →</button>':''}</div></div>`;if(document.getElementById('prevPage'))prevPage.onclick=()=>loadPage(page-1);if(document.getElementById('nextPage'))nextPage.onclick=()=>loadPage(page+1);return}
const x=leads[i],fu=String(x.nextFollowUp||'').split(' | ');queueCard.innerHTML=`<div class="queue-head"><div><span class="tag">${esc(x.id)}</span><h2>${esc(x.customerName||'Customer')}</h2><p>${esc(x.loanType||'Loan enquiry')} · Source: ${esc(x.source||'—')}</p></div><span class="status-pill">${esc(x.status||'New')}</span></div><div class="lead-field-grid">${field('Phone',x.mobile)}${field('Email',x.email)}${field('Address',x.address)}${field('Income / Salary',x.salary)}${field('Designation',x.designation)}${field('Pincode',x.pincode)}${field('Loan Amount',x.loanAmount)}${field('Created By',x.createdByExecutiveId)}</div><div class="queue-form"><label>Status<select id="qStatus">${HCCRM.statuses.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Stage<select id="qStage">${HCCRM.stages.map(s=>`<option ${s===x.stage?'selected':''}>${s}</option>`).join('')}</select></label><label>Next Follow-up Date<input id="qDate" type="date" value="${esc((fu[0]||'').slice(0,10))}"></label><label>Suitable Time<select id="qBand"><option value="">Select</option>${['Morning','Afternoon','Evening'].map(v=>`<option ${v===(x.followUpTimeBand||fu[1])?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">Comments<textarea id="qComments" rows="4">${esc(x.comments||'')}</textarea></label></div><div class="dashboard-actions"><button class="btn ghost" id="prevBtn" ${i===0&&page===1?'disabled':''}>← Previous</button><button class="btn primary" id="saveNext">Save & Next →</button></div>`;
prevBtn.onclick=()=>{if(i>0){i--;show()}else if(page>1)loadPage(page-1)};saveNext.onclick=async()=>{const b=saveNext;HCUI.setLoading(b,true,'Saving…');HCUI.message(queueMessage,'Saving your update…','');try{const next=[qDate.value,qBand.value].filter(Boolean).join(' | ');await HCCRM.updateLead(x.id,{status:qStatus.value,stage:qStage.value,comments:qComments.value,nextFollowUp:next,followUpTimeBand:qBand.value});HCUI.message(queueMessage,'Updated.','ok');if(i<leads.length-1){i++;show()}else if(page*pageSize<total){await loadPage(page+1)}else{await loadPage(page)}}catch(e){HCUI.message(queueMessage,e.message||'Unable to save the lead. Please try again.','error')}finally{HCUI.setLoading(b,false)}}}
try{await loadPage(1)}catch(e){HCUI.message(queueMessage,e.message||'Unable to load assigned leads.','error');queueCard.innerHTML='<div class="empty-state"><h3>Unable to load queue</h3><p>Please try again.</p></div>'}})();</script><script src="nav-shared.js"></script><script src="site-ads.js"></script><script src="app-shell.js"></script></body></html>
