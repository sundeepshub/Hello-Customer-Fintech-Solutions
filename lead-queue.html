<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Queue | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="lead-queue.html">Lead Queue</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="loan-rates.html">Loan Rates</a><a href="government-schemes.html">Schemes</a><a href="executive-profile.html">Profile</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Sequential work queue</div><h1>Assigned Lead Queue</h1><p>Update the current lead, save it to Google Sheets, then move directly to the next assigned lead.</p></div><div class="queue-counter" id="counter">0 / 0</div></div>
<div id="queueMessage" class="auth-message"></div><div id="queueCard" class="portal-card">Loading assigned leads…</div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;let leads=await HCCRM.myLeads(),i=0;leads=leads.filter(x=>!['Closed','Disbursed','Rejected','Not Interested'].includes(x.status));const esc=HCCRM.esc;
function field(label,v){return `<div class="lead-field"><span>${label}</span><b>${esc(v===0?'0':(v||'—'))}</b></div>`}
function show(){counter.textContent=leads.length?(i+1)+' / '+leads.length:'0 / 0';if(!leads.length){queueCard.innerHTML='<div class="empty-state"><h3>No active assigned leads</h3><p>New assigned leads will appear here automatically.</p></div>';return}const x=leads[i];queueCard.innerHTML=`<div class="queue-head"><div><span class="tag">${esc(x.id)}</span><h2>${esc(x.customerName||'Customer')}</h2><p>${esc(x.loanType||'Loan enquiry')}</p></div><span class="status-pill">${esc(x.status||'New')}</span></div><div class="lead-field-grid">${field('Phone',x.mobile)}${field('Email',x.email)}${field('Address',x.address)}${field('Salary',x.salary)}${field('Designation',x.designation)}${field('Pincode',x.pincode)}${field('Loan Amount',x.loanAmount)}${field('Source',x.source)}</div><div class="queue-form"><label>Status<select id="qStatus">${HCCRM.statuses.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Stage<select id="qStage">${HCCRM.stages.map(s=>`<option ${s===x.stage?'selected':''}>${s}</option>`).join('')}</select></label><label class="full">Comments<textarea id="qComments" rows="4" placeholder="Call outcome, customer response, next action...">${esc(x.comments||'')}</textarea></label><label>Next Follow-up<input id="qFollow" type="datetime-local"></label></div><div class="dashboard-actions"><button class="btn ghost" id="prevBtn" ${i===0?'disabled':''}>← Previous</button><button class="btn primary" id="saveNext">Save & Next →</button></div>`;
prevBtn.onclick=()=>{if(i>0){i--;show()}};saveNext.onclick=async()=>{saveNext.disabled=true;queueMessage.textContent='Saving…';queueMessage.className='auth-message';try{await HCCRM.updateLead(x.id,{status:qStatus.value,stage:qStage.value,comments:qComments.value,nextFollowUp:qFollow.value});x.status=qStatus.value;x.stage=qStage.value;x.comments=qComments.value;queueMessage.textContent='Lead updated in Google Sheets.';queueMessage.className='auth-message ok';if(i<leads.length-1)i++;else leads=leads.filter(z=>!['Closed','Disbursed','Rejected','Not Interested'].includes(z.status));show()}catch(e){queueMessage.textContent=e.message;queueMessage.className='auth-message error';saveNext.disabled=false}}}
show()})();</script><script src="nav-shared.js"></script></body></html>
