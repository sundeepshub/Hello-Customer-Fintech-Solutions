<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Ad Manager | Hello Customer</title><link rel="stylesheet" href="style.css"></head><body class="portal-body"><header class="site-header"><div class="container nav"><a class="brand" href="admin-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="admin-dashboard.html">Dashboard</a><a href="social-publisher.html">Social Publisher</a><a href="social-config.html">Social Config</a><button class="btn primary small" id="logout">Logout</button></nav></div></header><main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Site advertising</div><h1>Application Ad Manager</h1><p>Create promotional messages, images or videos that can appear across the website and portal.</p></div></div><div class="dashboard-grid"><form id="adForm" class="dashboard-panel"><h2>Create / Update Ad</h2><div class="fields two"><label>Template<select name="template"><option>Professional Loan Offer</option><option>Loan Rate Update</option><option>Government Scheme Alert</option><option>Festival Offer</option><option>Custom</option></select></label><label>Placement<select name="placement"><option value="top">Top Banner</option><option value="bottom">Bottom Banner</option><option value="dashboard">Dashboard Card</option><option value="all">All Pages</option></select></label><label>Content Type<select name="contentType"><option>Text</option><option>Image</option><option>Video</option></select></label><label>Image Size<select name="imageSize"><option>1200×628</option><option>1080×1080</option><option>1080×1350</option><option>1080×1920</option></select></label><label class="full">Headline<input name="headline" required maxlength="120"></label><label class="full">Message<textarea name="message" rows="4" maxlength="1000"></textarea></label><label class="full">Media URL<input name="mediaUrl" type="url" placeholder="https://..."></label><label>Text Effect<select name="textEffect"><option>None</option><option>Soft Highlight</option><option>Pulse</option><option>Gradient</option></select></label><label>CTA Text<input name="ctaText" value="Know More"></label><label class="full">CTA URL<input name="ctaUrl" type="url"></label><label><input type="checkbox" name="enabled" checked> Enabled</label></div><button class="btn primary" type="submit">Save Ad</button><div id="adMsg" class="auth-message"></div></form><div class="dashboard-panel"><h2>Active Ads</h2><div id="adList">Loading…</div></div></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script><script>(async()=>{await HCAuth.guard({adminOnly:true});logout.onclick=HCAuth.logout;async function load(){const d=await HCCRM.api('adminListAds');adList.innerHTML=(d.ads||[]).map(a=>`<div class="portal-subcard"><b>${HCCRM.esc(a.headline)}</b><p>${HCCRM.esc(a.placement)} · ${HCCRM.esc(a.contentType)} · ${a.enabled?'Enabled':'Disabled'}</p><button class="btn ghost small toggleAd" data-id="${a.id}" data-enabled="${!a.enabled}">${a.enabled?'Disable':'Enable'}</button></div>`).join('')||'<p>No ads configured.</p>';document.querySelectorAll('.toggleAd').forEach(b=>b.onclick=async()=>{HCUI.setLoading(b,true,'Saving…');await HCCRM.api('adminToggleAd',{id:b.dataset.id,enabled:b.dataset.enabled});await load()})}adForm.onsubmit=async e=>{e.preventDefault();const b=adForm.querySelector('button[type=submit]');HCUI.setLoading(b,true,'Saving ad…');try{const d=Object.fromEntries(new FormData(adForm).entries());d.enabled=adForm.enabled.checked;await HCCRM.api('adminSaveAd',d);HCUI.message(adMsg,'Changes are saved successfully and the backend has been updated.','ok');adForm.reset();adForm.enabled.checked=true;await load()}catch(x){HCUI.message(adMsg,x.message,'error')}finally{HCUI.setLoading(b,false)}};await load()})();</script><script src="nav-shared.js"></script><script src="site-ads.js"></script></body></html>
