<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Library | Hello Customer</title><link rel="stylesheet" href="style.css"></head><body class="portal-body"><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="content-library.html">Content Library</a><button class="btn primary small" id="logout">Logout</button></nav></div></header><main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Marketing resources</div><h1>Social Text Message Library</h1><p>Google Sheet-backed library: 150 messages each for WhatsApp, Facebook, Instagram and ShareChat.</p></div></div><div class="dashboard-panel"><div class="fields three"><label>Platform<select id="platformFilter"><option value="">All</option><option>WhatsApp</option><option>Facebook</option><option>Instagram</option><option>ShareChat</option></select></label><label>Category<select id="categoryFilter"><option value="">All Categories</option></select></label><label>Search<input id="messageSearch"></label></div></div><div id="messageGrid" class="hc-message-grid">Loading…</div></div></section></main><div class="modal-backdrop" id="pushModal" hidden><div class="modal-card"><div class="section-head"><h2>Push Message</h2><button class="btn ghost small" id="closePush">Close</button></div><p id="pushTitle"></p><div class="fields two"><label>Platform<select id="pushPlatform"><option>WhatsApp</option><option>Facebook</option><option>Instagram</option><option>ShareChat</option></select></label><label>CTA<select id="pushCta"><option>Start Enquiry</option><option>Check Eligibility</option><option>Know More</option><option>Get Quote</option><option>Apply Now</option><option>Talk to Advisor</option><option>Book Call</option></select></label><label class="full">Tracked Guest Link<input id="pushLink" readonly></label></div><button class="btn primary" id="confirmPush">Continue to Social Publisher</button></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script><script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;let rows=[],chosen;const esc=HCCRM.esc,d=await HCCRM.api('contentLibrary');rows=d.messages||[];[...new Set(rows.map(x=>x.category))].sort().forEach(x=>categoryFilter.add(new Option(x,x)));function render(){const p=platformFilter.value,c=categoryFilter.value,q=messageSearch.value.toLowerCase(),a=rows.filter(x=>(!p||x.platform===p)&&(!c||x.category===c)&&(!q||(x.title+' '+x.message).toLowerCase().includes(q)));messageGrid.innerHTML=a.map(x=>`<article class="dashboard-panel hc-message-row"><div><span class="tag">${esc(x.platform)}</span> <small>${esc(x.category)}</small><h3>${esc(x.title)}</h3><p>${esc(x.message)}</p></div><div class="action-bar"><button class="btn primary small push" data-id="${x.id}">Push</button>${profile.role==='admin'?`<button class="btn ghost small cfg" data-id="${x.id}">Configure</button>`:''}</div></article>`).join('');document.querySelectorAll('.push').forEach(b=>b.onclick=()=>{chosen=rows.find(x=>x.id===b.dataset.id);pushTitle.textContent=chosen.title;pushPlatform.value=chosen.platform;const ref=profile.role==='admin'?'AID-ADMIN':(profile.role==='connector'?'CID-':'EID-')+(profile.executiveId||'USER'),u=new URL('guest-login.html',location.href);u.searchParams.set('source',chosen.platform.toLowerCase());u.searchParams.set('ref',ref);u.searchParams.set('content',chosen.id);pushLink.value=u.href;pushModal.hidden=false});document.querySelectorAll('.cfg').forEach(b=>b.onclick=async()=>{const roles=prompt('Allowed roles: all, admin, telecaller, connector','admin,telecaller,connector');if(roles===null)return;const uids=prompt('Specific user UIDs, comma separated (optional)','');if(uids===null)return;await HCCRM.api('adminSaveContent',{id:b.dataset.id,enabled:true,allowedRoles:roles,allowedUids:uids});HCUI.toast('Configured.','ok')})}closePush.onclick=()=>pushModal.hidden=true;confirmPush.onclick=()=>{sessionStorage.setItem('hcPushDraft',JSON.stringify({title:chosen.title,caption:chosen.message.replace('{{TRACKING_LINK}}',pushLink.value),platform:pushPlatform.value,cta:pushCta.value,trackingUrl:pushLink.value}));location.href='social-publisher.html?draft=1'};platformFilter.onchange=categoryFilter.onchange=render;messageSearch.oninput=render;render()})();</script><script src="nav-shared.js"></script><script src="app-shell.js"></script></body></html>
