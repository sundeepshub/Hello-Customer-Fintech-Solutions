<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insurance Guest Enquiry | Hello Customer</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div>
<header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="insurance-guest.html">Insurance Guest Form</a><a href="insurance-leads.html">Insurance Leads</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Internal tracked insurance enquiry</div><h1>Insurance Guest Form</h1><p>Create a shareable insurance enquiry form for a customer. This page is available only inside authorised portal access.</p></div></div>
<div class="dashboard-panel"><div class="hc-tabbar"><span class="hc-section-pill">Basic Details</span></div><form id="insuranceForm"><input type="hidden" name="submitMode" id="submitMode" value="Basic Details"><div class="fields two">
<label>Insurance Type *<select name="insuranceType" id="insuranceType" required><option value="">Select</option><option>Health Insurance</option><option>Term Insurance</option><option>Personal Accident</option><option>Motor Insurance</option><option>Travel Insurance</option><option>Home / Property Insurance</option><option>Business Insurance</option></select></label>
<label>Full Name *<input name="fullName" required maxlength="120"></label><label>Mobile *<input name="mobile" required inputmode="numeric" maxlength="10"></label><label>Email<input name="email" type="email"></label>
<label>City / Pincode<input name="location" placeholder="City or 6-digit pincode"></label><label>Preferred Contact Time<select name="contactTime"><option value="">Select</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
</div>
<div id="detailFields"><div class="fields two"><label>Date of Birth<input name="dob" type="date"></label><label>Occupation<input name="occupation"></label><label>Annual Income<input name="annualIncome" type="number" min="0"></label><label>Existing Policy?<select name="existingPolicy"><option>No</option><option>Yes</option><option>Not sure</option></select></label><label>Existing Insurer<input name="existingInsurer"></label><label>Existing Sum Insured / Cover<input name="existingCover"></label><label>Members to Cover<input name="memberCount" type="number" min="1" max="20"></label><label>Preferred Sum Insured / Cover<input name="preferredCover"></label><label class="full">Family / Member Details<textarea name="memberDetails" rows="4" placeholder="Names/relationship/age where relevant"></textarea></label><label class="full">Known medical / underwriting details relevant to the enquiry<textarea name="medicalNotes" rows="4" placeholder="Only information the customer chooses to share for insurance discussion. Do not enter passwords, OTPs or card details."></textarea></label><div class="full" id="insuranceConditional"></div></div></div>
<label class="check"><input name="consent" type="checkbox" required> I consent to being contacted regarding this insurance enquiry and understand that final eligibility, premium and coverage depend on insurer underwriting and policy terms.</label>
<div class="action-bar"><button class="btn primary" type="submit">Submit Insurance Enquiry</button><button class="btn ghost" id="clearInsurance" type="button">Clear</button></div><div id="insuranceMsg" class="auth-message"></div></form></div>
</div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;if(profile.role!=='admin'&&profile.permissions?.insuranceGuest!==true){location.href='executive-dashboard.html?access=denied';return}
function renderInsuranceFields(){const v=insuranceType.value;const sets={
'Health Insurance':`<div class="portal-subcard"><h3>Health Insurance Details</h3><div class="fields two"><label>Cover For<select name="healthCoverFor"><option>Self</option><option>Self + Spouse</option><option>Family Floater</option><option>Parents</option><option>Senior Citizens</option></select></label><label>Preferred Sum Insured<input name="healthSumInsured"></label><label>Any Existing Health Policy?<select name="healthExisting"><option>No</option><option>Yes</option></select></label><label>Any Known Medical Conditions?<select name="healthMedical"><option>No</option><option>Yes</option><option>Prefer to discuss</option></select></label><label>Need Maternity Cover?<select name="healthMaternity"><option>No</option><option>Yes</option><option>Not Applicable</option></select></label><label>Need Parents in Same/Separate Policy?<select name="healthParents"><option>Not Required</option><option>Same Policy</option><option>Separate Policy</option></select></label></div></div>`,
'Term Insurance':`<div class="portal-subcard"><h3>Term Insurance Details</h3><div class="fields two"><label>Required Life Cover<input name="termCover"></label><label>Policy Term Preference<input name="termYears" type="number" min="1"></label><label>Smoker / Tobacco?<select name="tobacco"><option>No</option><option>Yes</option></select></label><label>Existing Life Cover<input name="existingLifeCover"></label><label>Any Loans / Liabilities?<select name="termLiabilities"><option>No</option><option>Yes</option></select></label><label>Nominee Relationship<input name="nomineeRelation"></label></div></div>`,
'Personal Accident':`<div class="portal-subcard"><h3>Personal Accident Details</h3><div class="fields two"><label>Occupation Risk Type<select name="paRisk"><option>Office / Desk</option><option>Field Work</option><option>Industrial / Site</option><option>Other</option></select></label><label>Required Cover<input name="paCover"></label><label>Frequent Travel?<select name="paTravel"><option>No</option><option>Yes</option></select></label></div></div>`,
'Motor Insurance':`<div class="portal-subcard"><h3>Motor Insurance Details</h3><div class="fields two"><label>Vehicle Type<select name="vehicleType"><option>Car</option><option>Two Wheeler</option><option>Commercial Vehicle</option></select></label><label>Registration Number<input name="vehicleReg"></label><label>Make / Model<input name="vehicleModel"></label><label>Registration Year<input name="vehicleYear" type="number"></label><label>Existing Policy Expiry<input name="motorExpiry" type="date"></label><label>Claim in Current Policy?<select name="motorClaim"><option>No</option><option>Yes</option></select></label></div></div>`,
'Travel Insurance':`<div class="portal-subcard"><h3>Travel Insurance Details</h3><div class="fields two"><label>Destination Country / Region<input name="travelDestination"></label><label>Travel Start<input name="travelStart" type="date"></label><label>Travel End<input name="travelEnd" type="date"></label><label>Travellers<input name="travellers" type="number" min="1"></label><label>Purpose<select name="travelPurpose"><option>Tourism</option><option>Business</option><option>Study</option><option>Other</option></select></label></div></div>`,
'Home / Property Insurance':`<div class="portal-subcard"><h3>Property Insurance Details</h3><div class="fields two"><label>Property Type<select name="propertyType"><option>Apartment</option><option>Independent House</option><option>Commercial</option></select></label><label>Property City<input name="propertyCity"></label><label>Building / Contents Cover<select name="propertyCover"><option>Building</option><option>Contents</option><option>Building + Contents</option></select></label><label>Approx. Property Value<input name="propertyValue"></label></div></div>`,
'Business Insurance':`<div class="portal-subcard"><h3>Business Insurance Details</h3><div class="fields two"><label>Business Type<input name="businessType"></label><label>Employees<input name="employees" type="number" min="0"></label><label>Cover Required<select name="businessCover"><option>Group Health</option><option>Group Personal Accident</option><option>Fire / Property</option><option>Liability</option><option>Marine / Transit</option><option>Multiple Covers</option></select></label><label>Approx. Annual Turnover<input name="businessTurnover"></label></div></div>`};insuranceConditional.innerHTML=sets[v]||'<p class="muted">Select an insurance type to see the relevant questions.</p>'}
insuranceType.onchange=renderInsuranceFields;renderInsuranceFields();insuranceForm.mobile.oninput=()=>insuranceForm.mobile.value=insuranceForm.mobile.value.replace(/\D/g,'').slice(0,10);insuranceForm.onsubmit=async e=>{e.preventDefault();const b=insuranceForm.querySelector('button[type=submit]');HCUI.setLoading(b,true,'Submitting…');try{const d=await HCCRM.api('insuranceGuestSubmit',Object.fromEntries(new FormData(insuranceForm).entries()));insuranceForm.innerHTML=`<div class="empty-state"><h2>Thank you</h2><p>Insurance enquiry ${HCCRM.esc(d.leadId||'')} was submitted successfully.</p><a class="btn primary" href="insurance-guest.html">Create Another Enquiry</a></div>`}catch(e){HCUI.message(insuranceMsg,e.message,'error')}finally{HCUI.setLoading(b,false)}};clearInsurance.onclick=()=>{insuranceForm.reset();renderInsuranceFields();insuranceMsg.textContent=''}})();
</script><script src="nav-shared.js"></script><script src="app-shell.js"></script></body></html>
