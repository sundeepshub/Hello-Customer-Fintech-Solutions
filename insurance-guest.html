<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insurance Guest Enquiry | Hello Customer</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div>
<header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="insurance-guest.html">Insurance Guest Form</a><a href="insurance-leads.html">Insurance Leads</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Internal tracked insurance enquiry</div><h1>Insurance Guest Form</h1><p>Create a shareable insurance enquiry form for a customer. This page is available only inside authorised portal access.</p></div></div>
<div class="dashboard-panel"><div class="hc-tabbar"><button class="btn ghost active" id="quickTab" type="button">Quick Submit</button><button class="btn ghost" id="detailTab" type="button">Detailed Submit</button></div>
<form id="insuranceForm"><input type="hidden" name="submitMode" id="submitMode" value="Quick"><div class="fields two">
<label>Insurance Type *<select name="insuranceType" id="insuranceType" required><option value="">Select</option><option>Health Insurance</option><option>Term Insurance</option><option>Personal Accident</option><option>Motor Insurance</option><option>Travel Insurance</option><option>Home / Property Insurance</option><option>Business Insurance</option></select></label>
<label>Full Name *<input name="fullName" required maxlength="120"></label><label>Mobile *<input name="mobile" required inputmode="numeric" maxlength="10"></label><label>Email<input name="email" type="email"></label>
<label>City / Pincode<input name="location" placeholder="City or 6-digit pincode"></label><label>Preferred Contact Time<select name="contactTime"><option value="">Select</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
</div>
<div id="quickFields"><div class="fields two"><label>Who needs cover?<select name="coverFor"><option>Self</option><option>Self + Spouse</option><option>Family</option><option>Parents</option><option>Children</option><option>Business / Employees</option></select></label><label>Approx. Budget / Premium Preference<input name="budget" placeholder="Optional"></label></div></div>
<div id="detailFields" hidden><div class="fields two"><label>Date of Birth<input name="dob" type="date"></label><label>Occupation<input name="occupation"></label><label>Annual Income<input name="annualIncome" type="number" min="0"></label><label>Existing Policy?<select name="existingPolicy"><option>No</option><option>Yes</option><option>Not sure</option></select></label><label>Existing Insurer<input name="existingInsurer"></label><label>Existing Sum Insured / Cover<input name="existingCover"></label><label>Members to Cover<input name="memberCount" type="number" min="1" max="20"></label><label>Preferred Sum Insured / Cover<input name="preferredCover"></label><label class="full">Family / Member Details<textarea name="memberDetails" rows="4" placeholder="Names/relationship/age where relevant"></textarea></label><label class="full">Known medical / underwriting details relevant to the enquiry<textarea name="medicalNotes" rows="4" placeholder="Only information the customer chooses to share for insurance discussion. Do not enter passwords, OTPs or card details."></textarea></label><label class="full">Vehicle / Travel / Property / Business Details<textarea name="assetNotes" rows="4" placeholder="Fill only if relevant to the selected insurance type"></textarea></label></div></div>
<label class="check"><input name="consent" type="checkbox" required> I consent to being contacted regarding this insurance enquiry and understand that final eligibility, premium and coverage depend on insurer underwriting and policy terms.</label>
<div class="action-bar"><button class="btn primary" type="submit">Submit Insurance Enquiry</button><button class="btn ghost" id="clearInsurance" type="button">Clear</button></div><div id="insuranceMsg" class="auth-message"></div></form></div>
</div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;if(profile.role!=='admin'&&profile.permissions?.insuranceGuest!==true){location.href='executive-dashboard.html?access=denied';return}
function mode(m){submitMode.value=m;quickTab.classList.toggle('active',m==='Quick');detailTab.classList.toggle('active',m==='Detailed');detailFields.hidden=m!=='Detailed'}quickTab.onclick=()=>mode('Quick');detailTab.onclick=()=>mode('Detailed');insuranceForm.mobile.oninput=()=>insuranceForm.mobile.value=insuranceForm.mobile.value.replace(/\D/g,'').slice(0,10);insuranceForm.onsubmit=async e=>{e.preventDefault();const b=insuranceForm.querySelector('button[type=submit]');HCUI.setLoading(b,true,'Submitting…');try{const d=await HCCRM.api('insuranceGuestSubmit',Object.fromEntries(new FormData(insuranceForm).entries()));insuranceForm.innerHTML=`<div class="empty-state"><h2>Thank you</h2><p>Insurance enquiry ${HCCRM.esc(d.leadId||'')} was submitted successfully.</p><a class="btn primary" href="insurance-guest.html">Create Another Enquiry</a></div>`}catch(e){HCUI.message(insuranceMsg,e.message,'error')}finally{HCUI.setLoading(b,false)}};clearInsurance.onclick=()=>{insuranceForm.reset();mode('Quick');insuranceMsg.textContent=''}})();
</script><script src="nav-shared.js"></script><script src="app-shell.js"></script></body></html>
