<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insurance Leads | Hello Customer</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div>
<header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="insurance-guest.html">Insurance Guest Form</a><a href="insurance-leads.html">Insurance Leads</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Insurance workspace</div><h1>Insurance Leads</h1><p>View insurance enquiries visible to your account.</p></div></div><div class="dashboard-panel"><div class="section-head"><div><h2>Lead List</h2></div><input id="q" class="compact-search" placeholder="Search"></div><div id="insuranceList">Loading…</div></div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;if(profile.role!=='admin'&&profile.permissions?.insuranceLeads!==true){location.href='executive-dashboard.html?access=denied';return}const d=await HCCRM.api('insuranceLeads'),rows=d.leads||[];function render(){const s=q.value.toLowerCase(),a=rows.filter(x=>!s||JSON.stringify(x).toLowerCase().includes(s));insuranceList.innerHTML=a.length?`<div class="rate-table-wrap"><table class="rate-table"><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Type</th><th>Mode</th><th>Source</th><th>Created</th></tr></thead><tbody>${a.map(x=>`<tr><td>${HCCRM.esc(x.id)}</td><td>${HCCRM.esc(x.fullName)}</td><td>${HCCRM.esc(x.mobile)}</td><td>${HCCRM.esc(x.insuranceType)}</td><td>${HCCRM.esc(x.submitMode)}</td><td>${HCCRM.esc(x.sourceExecutiveId||'Admin')}</td><td>${HCCRM.esc(x.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No insurance leads found.</p>'}q.oninput=render;render()})();
</script><script src="nav-shared.js"></script><script src="app-shell.js"></script></body></html>
