<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Lead | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head>
<body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="lead-queue.html">Assigned Queue</a><a href="my-leads.html">My Leads</a><a href="social-publisher.html">Social Publisher</a><a href="executive-profile.html">Profile</a><button class="btn primary small" id="logout">Logout</button></nav></div></header>
<main class="portal-main"><section class="section"><div class="container narrow"><div class="dashboard-head"><div><div class="eyebrow">Lead entry</div><h1>Add Customer Lead</h1><p>Capture the customer profile, existing commitments, credit concerns and follow-up preference.</p></div></div>
<form id="leadForm" class="portal-card" novalidate><div class="fields two">
<label>Customer Name *<input name="customerName" required maxlength="120"></label>
<label>Mobile *<input name="mobile" required inputmode="numeric" maxlength="10"></label>
<label>Email<input name="email" type="email" maxlength="160"></label>
<label>Customer Profile *<select name="employment" id="employment" required><option value="">Select</option><option>Salaried</option><option>Self-employed / Business</option><option>Self-employed Professional</option><option>Student</option><option>Homemaker</option><option>Retired</option><option>Other</option></select></label>
<div id="profileDetails" class="full fields two"></div>
<label class="full">Address<textarea name="address" rows="2" maxlength="500"></textarea></label>
<label>Pincode<input name="pincode" inputmode="numeric" maxlength="6"></label>
<label>Loan Type *<select name="loanType" required><option value="">Select</option><option>Personal Loan</option><option>Home Loan</option><option>Home Loan Balance Transfer + Top-up</option><option>Business Loan</option><option>Loan Against Property</option><option>Vehicle Loan</option><option>Education Loan</option><option>Balance Transfer / Consolidation</option><option>Project Funds</option></select></label>
<label>Loan Amount<input name="loanAmount" type="number" min="0"></label>
<label class="full">Purpose / Requirement *<textarea name="purpose" rows="3" maxlength="1000" required></textarea></label>
<label>Any Existing EMIs? *<select name="hasEmis" id="hasEmis" required><option value="">Select</option><option>No</option><option>Yes</option></select></label>
<label id="emiCountWrap" hidden>How many EMIs?<input name="emiCount" id="emiCount" type="number" min="1" max="50"></label>
<div id="emiDetails" class="full"></div>
<label>Any CIBIL / Credit Issue? *<select name="hasCibilIssue" id="hasCibilIssue" required><option value="">Select</option><option>No</option><option>Yes</option><option>Not sure</option></select></label>
<label id="cibilDetailsWrap" class="full" hidden>CIBIL / Credit Issue Details<textarea name="cibilDetails" rows="3" maxlength="1200" placeholder="Late payment, settlement, overdue, unknown account, enquiries, score if known, etc."></textarea></label>
<label>Next Follow-up Date<input name="followUpDate" type="date"></label>
<label>Suitable Time<select name="followUpTimeBand"><option value="">Select</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
<label class="full">Comments<textarea name="comments" rows="3" maxlength="1500" placeholder="Customer response, call notes, next action..."></textarea></label>
</div><button class="btn primary" type="submit">Create Lead →</button><div id="formMessage" class="auth-message"></div></form>
</div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{await HCAuth.guard();logout.onclick=HCAuth.logout;const f=document.getElementById('leadForm'),m=formMessage;
f.mobile.oninput=()=>f.mobile.value=f.mobile.value.replace(/\D/g,'').slice(0,10);f.pincode.oninput=()=>f.pincode.value=f.pincode.value.replace(/\D/g,'').slice(0,6);
employment.onchange=()=>{const v=employment.value;let h='';if(v==='Salaried')h='<label>Designation *<input name="designation" required maxlength="120"></label><label>Monthly Salary *<input name="salary" type="number" min="0" required></label><label>Company Name<input name="companyName" maxlength="160"></label><label>PF Deduction<select name="pfDeduction"><option value="">Select</option><option>Yes</option><option>No</option></select></label>';else if(v==='Self-employed / Business')h='<label>Business Name *<input name="businessName" required maxlength="160"></label><label>Business Type<input name="businessType" maxlength="120"></label><label>Monthly Income / Drawings<input name="salary" type="number" min="0"></label><label>Business Vintage (Years)<input name="businessVintage" type="number" min="0" max="100"></label>';else if(v==='Self-employed Professional')h='<label>Profession *<input name="designation" required maxlength="120" placeholder="Doctor, CA, Architect, Consultant..."></label><label>Practice / Firm Name<input name="businessName" maxlength="160"></label><label>Monthly Professional Income<input name="salary" type="number" min="0"></label><label>Years in Practice<input name="businessVintage" type="number" min="0" max="100"></label>';else if(v==='Student')h='<label>Course / Education<input name="designation" maxlength="160"></label><label>Family Monthly Income<input name="salary" type="number" min="0"></label>';else if(v==='Retired')h='<label>Former Designation / Profession<input name="designation" maxlength="120"></label><label>Pension / Monthly Income<input name="salary" type="number" min="0"></label>';else if(v==='Homemaker')h='<label>Family Monthly Income<input name="salary" type="number" min="0"></label>';else if(v==='Other')h='<label>Occupation / Profile *<input name="designation" required maxlength="120"></label><label>Monthly Income<input name="salary" type="number" min="0"></label>';profileDetails.innerHTML=h};
hasEmis.onchange=()=>{const on=hasEmis.value==='Yes';emiCountWrap.hidden=!on;if(!on){emiCount.value='';emiDetails.innerHTML=''}};
emiCount.oninput=()=>{let n=Math.max(0,Math.min(50,+emiCount.value||0));emiDetails.innerHTML=n?'<h3>Existing EMI Details</h3>'+Array.from({length:n},(_,i)=>`<div class="portal-subcard"><h4>EMI ${i+1}</h4><div class="fields two"><label>Lender<input name="emiLender_${i+1}" required></label><label>EMI / Month<input name="emiAmount_${i+1}" type="number" min="0" required></label><label>Outstanding Amount<input name="emiOutstanding_${i+1}" type="number" min="0"></label><label>Remaining Tenure (months)<input name="emiTenure_${i+1}" type="number" min="0"></label><label>Cheque Bounce in last 6 months?<select name="emiBounce_${i+1}"><option value="">Select</option><option>Yes</option><option>No</option></select></label><label>Loan Type<input name="emiType_${i+1}"></label></div></div>`).join(''):''};
hasCibilIssue.onchange=()=>cibilDetailsWrap.hidden=!['Yes','Not sure'].includes(hasCibilIssue.value);
f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type=submit]');try{if(!f.reportValidity())return;if(!/^[6-9]\d{9}$/.test(f.mobile.value))throw Error('Enter a valid 10-digit mobile number.');if(f.pincode.value&&!/^\d{6}$/.test(f.pincode.value))throw Error('Enter a valid 6-digit pincode.');HCUI.setLoading(b,true,'Creating lead…');m.textContent='Please wait while the lead is saved…';m.className='auth-message';const data=Object.fromEntries(new FormData(f).entries());const emis=[];for(let i=1;i<=+data.emiCount||0;i++)emis.push({lender:data['emiLender_'+i]||'',emi:data['emiAmount_'+i]||'',outstanding:data['emiOutstanding_'+i]||'',tenure:data['emiTenure_'+i]||'',bounce:data['emiBounce_'+i]||'',loanType:data['emiType_'+i]||''});data.emiDetailsJson=JSON.stringify(emis);data.nextFollowUp=[data.followUpDate,data.followUpTimeBand].filter(Boolean).join(' | ');const id=await HCCRM.createLead(data);await HCCRM.addActivity(id,'Lead Created','Lead created from portal.');location.href='lead-details.html?id='+encodeURIComponent(id)}catch(x){HCUI.message(m,x.message||'Unable to create lead.','error');HCUI.setLoading(b,false)}}})();</script><script src="nav-shared.js"></script><script src="site-ads.js"></script><script src="app-shell.js"></script></body></html>
