<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Lead | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="executive-dashboard.html">Dashboard</a><a href="my-leads.html">My Leads</a><a href="executive-profile.html">Profile</a></nav></div></header><main><section class="section"><div class="container narrow"><div class="dashboard-head"><div><div class="eyebrow">Executive lead entry</div><h1>Add a customer lead</h1><p>The lead will belong to your account and will be visible only to you and administrators unless reassigned.</p></div><a class="btn ghost" href="my-leads.html">← My Leads</a></div><form id="leadForm" class="auth-card"><div class="fields two"><label>Customer name *<input name="customerName" required maxlength="120"></label><label>Mobile *<input name="mobile" required inputmode="numeric" maxlength="10"></label><label>Email<input name="email" type="email"></label><label>Loan type *<select name="loanType" required><option value="">Select</option><option>Personal Loan</option><option>Home Loan</option><option>Home Loan Balance Transfer + Top-up</option><option>Business Loan</option><option>Loan Against Property</option><option>Vehicle Loan</option><option>Education Loan</option><option>Balance Transfer / Consolidation</option><option>Project Funds</option></select></label><label>Loan amount<input name="loanAmount" type="number" min="0"></label><label>Customer profile<select name="employment"><option value="">Select</option><option>Salaried</option><option>Self-employed / Business</option><option>Self-employed Professional</option><option>Student</option><option>Homemaker</option><option>Retired</option><option>Other</option></select></label><label class="full">Purpose / requirement *<textarea name="purpose" rows="3" maxlength="1000" required></textarea></label></div><button class="btn primary" type="submit">Create Lead →</button><div id="formMessage" class="auth-message"></div></form></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script>(async()=>{if(!HCAuth.ready)return;const {user,profile}=await HCAuth.guard();const f=document.getElementById('leadForm');f.mobile.addEventListener('input',()=>f.mobile.value=f.mobile.value.replace(/\D/g,'').slice(0,10));f.addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('formMessage');try{if(!/^[6-9]\d{9}$/.test(f.mobile.value))throw Error('Enter a valid 10-digit mobile number.');const id=await HCCRM.createLead(user.uid,profile,Object.fromEntries(new FormData(f).entries()));await HCCRM.addActivity(id,user.uid,profile,'Lead Created','Lead created by executive.');location.href='lead-details.html?id='+encodeURIComponent(id)}catch(x){m.textContent=x.message}})})();</script></body></html>
