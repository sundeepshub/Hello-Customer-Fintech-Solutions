<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive / Employee Login | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="home.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="home.html">Home</a><a href="loan-rates.html">Loan Rates</a><a href="government-schemes.html">Schemes</a><a href="index.html#eligibility">Start Enquiry</a></nav></div></header><main><section class="section"><div class="container auth-shell"><div><div class="eyebrow">Executive access</div><h1>Telecaller & Connector Login</h1></div><form id="loginForm" class="auth-card"><label>Username *<input name="username" autocomplete="username" required></label><label>Password *<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Login →</button><div id="authMessage" class="auth-message"></div><p><a href="forgot-password.html">Forgot password?</a></p><p>New executive? <a href="executive-signup.html">Sign up first</a></p><p><a href="login.html">← Back to login options</a></p></form></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Hello Customer Fintech Solutions</span><span>Private role-based executive access.</span></div></footer><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="ui.js"></script><script>document.querySelectorAll('[data-toggle-password]').forEach(b=>b.onclick=()=>{const x=document.getElementById(b.dataset.togglePassword);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'Show':'Hide'});const f=document.getElementById('loginForm');f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button[type=submit]'),m=document.getElementById('authMessage');HCUI.setLoading(b,true,'Signing in…');m.textContent='Please wait while we verify your account…';m.className='auth-message';try{if(!HCAuth.ready)throw Error('Please check with support for login issue.');await HCAuth.login(f)}catch(x){HCUI.message(m,HCAuth.friendly(x),'error');HCUI.setLoading(b,false)}});</script><script src="nav-shared.js"></script><script src="site-ads.js"></script></body></html>
