<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Dashboard | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="home.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="executive-dashboard.html">Dashboard</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="executive-profile.html">Profile</a><button class="btn primary small" id="logout">Logout</button></nav></div></header><main><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow" id="roleLabel">Executive Dashboard</div><h1 id="welcome">Welcome</h1><p id="execMeta">Loading your account…</p></div><div class="dashboard-actions"><a class="btn primary" href="new-lead.html">+ Add Lead</a><a class="btn ghost" href="my-leads.html">View My Leads</a></div></div><div class="metric-grid" id="metrics"></div><div class="dashboard-grid"><div class="dashboard-panel"><h2>Stage Overview</h2><div id="stageList"></div></div><div class="dashboard-panel"><h2>Status Overview</h2><div id="statusList"></div></div></div><div class="dashboard-panel"><h2>Upcoming follow-ups</h2><div id="followups"></div></div></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Hello Customer Fintech Solutions</span><span>Only your created or assigned leads are shown.</span></div></footer><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script>(async()=>{if(!HCAuth.ready)return;const {user,profile}=await HCAuth.guard();if(profile.role==='admin'){location.href='admin-dashboard.html';return}document.getElementById('welcome').textContent=`Welcome, ${profile.fullName||profile.username}`;document.getElementById('roleLabel').textContent=(profile.role||'Executive').toUpperCase()+' DASHBOARD';document.getElementById('execMeta').textContent=`${profile.executiveId||'ID pending'} · ${profile.username}`;document.getElementById('logout').onclick=HCAuth.logout;const leads=await HCCRM.myLeads(user.uid);const count=s=>leads.filter(x=>x.status===s).length;document.getElementById('metrics').innerHTML=[['My Leads',leads.length],['New',count('New')],['Follow-up',count('Follow-up')],['Approved',count('Approved')],['Disbursed',count('Disbursed')]].map(x=>`<article class="metric"><span>${x[0]}</span><b>${x[1]}</b></article>`).join('');document.getElementById('stageList').innerHTML=HCCRM.stages.map(s=>`<div class="stage-row"><span>${s}</span><b>${leads.filter(x=>x.stage===s).length}</b></div>`).join('');document.getElementById('statusList').innerHTML=HCCRM.statuses.map(s=>`<div class="stage-row"><span>${s}</span><b>${count(s)}</b></div>`).join('');const f=leads.filter(x=>x.nextFollowUp).sort((a,b)=>String(a.nextFollowUp).localeCompare(String(b.nextFollowUp))).slice(0,10);document.getElementById('followups').innerHTML=f.length?f.map(x=>`<div class="stage-row"><span><a href="lead-details.html?id=${encodeURIComponent(x.id)}"><b>${HCCRM.esc(x.customerName||x.id)}</b></a> · ${HCCRM.esc(x.loanType||'')}</span><b>${HCCRM.esc(x.nextFollowUp)}</b></div>`).join(''):'<p class="muted">No follow-ups scheduled.</p>'})();</script></body></html>
