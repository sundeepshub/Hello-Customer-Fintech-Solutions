<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="home.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="home.html">Home</a><a href="loan-rates.html">Loan Rates</a><a href="government-schemes.html">Schemes</a><a href="index.html#eligibility">Start Enquiry</a><a class="nav-cta" href="executive-login.html">Executive Login</a></nav></div></header><main><section class="section"><div class="container"><div class="eyebrow">Administrator</div><h1>Admin Dashboard</h1><div id="adminContent" class="dashboard-panel">Checking permissions…</div></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Hello Customer Fintech Solutions</span><span>Rates, schemes, eligibility and approval remain subject to the respective lender/authority.</span></div></footer><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js"></script><script>(async()=>{if(!HCAuth.ready)return;const {profile}=await HCAuth.guard();if(profile.role!=='admin'){document.getElementById('adminContent').textContent='Access denied. Administrator role required.';return}const users=await HCAuth.db.collection('users').get(),leads=await HCAuth.db.collection('leads').get();const tc=users.docs.filter(x=>x.data().role==='telecaller').length,cn=users.docs.filter(x=>x.data().role==='connector').length;document.getElementById('adminContent').innerHTML=`<div class="metric-grid"><article class="metric"><span>Telecallers</span><b>${tc}/100</b></article><article class="metric"><span>Connectors</span><b>${cn}/200</b></article><article class="metric"><span>Total Leads</span><b>${leads.size}</b></article></div><p>Use Firebase Console or build an approved admin-management workflow before activating/deactivating accounts. Do not manage passwords in Sheets.</p>`})();</script></body></html>
