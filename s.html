<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening secure link… | Hello Customer</title><link rel="stylesheet" href="style.css"></head><body class="portal-body"><main class="auth-page"><section class="auth-card"><div class="brand-mark">HC</div><h1>Opening secure link…</h1><p id="m">Please wait while the tracking link is verified.</p><span class="page-loader-spinner"></span></section></main><script src="portal-config.js"></script><script>(async()=>{const c=new URLSearchParams(location.search).get('c');if(!c){m.textContent='This link is incomplete.';return}try{const r=await fetch(window.HC_APP_SCRIPT_URL||window.HC_APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'resolveShortLink',code:c})}),d=await r.json();if(!d.ok||!d.url)throw Error(d.error||'Link unavailable');location.replace(d.url)}catch(e){m.textContent='This link could not be opened. Please request a new link.'}})()</script></body></html>
