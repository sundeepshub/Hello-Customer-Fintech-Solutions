<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><main><section class="section"><div class="container narrow"><div class="auth-card standalone"><div class="eyebrow">Account recovery</div><h1>Reset your password</h1><p>Enter the email address used during executive signup. Firebase will send a secure reset link.</p><form id="resetForm"><label>Email *<input type="email" name="email" required autocomplete="email"></label><button class="btn primary" type="submit">Send reset link →</button><div id="authMessage" class="auth-message"></div></form><p><a href="executive-login.html">← Back to login</a></p></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script>const f=document.getElementById('resetForm');f.addEventListener('submit',async e=>{e.preventDefault();try{if(!HCAuth.ready)throw Error('Firebase configuration is required before password reset can be used.');await HCAuth.resetPassword(f.email.value.trim());const m=document.getElementById('authMessage');m.textContent='Password reset link sent. Please check your email.';m.className='auth-message ok'}catch(x){document.getElementById('authMessage').textContent=HCAuth.friendly(x)}});</script><script src="nav-shared.js"></script></body></html>
