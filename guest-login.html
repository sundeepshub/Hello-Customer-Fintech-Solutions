<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest Access | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head>
<body><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="home.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav id="guestPublicNav"><a href="home.html">Home</a><a href="login.html">Login</a></nav></div></header>
<main><section class="section"><div class="container auth-shell"><div><img id="guestBrandImage" class="guest-hero-image" alt="Campaign"><div class="eyebrow">Guest access</div><h1>Continue as a Guest</h1><p>Enter the mandatory details below to continue to the information shared with you.</p><div id="sourceBadge" class="notice" hidden></div></div>
<form id="guestForm" class="auth-card" novalidate>
<label>Full Name *<input name="fullName" required maxlength="120" autocomplete="name"></label>
<label>Mobile Number *<input name="mobile" required inputmode="numeric" maxlength="10" autocomplete="tel"></label>
<label>Email *<input name="email" type="email" required maxlength="160" autocomplete="email"></label>
<label>Pincode *<input name="pincode" required inputmode="numeric" maxlength="6"></label>
<label>Loan Type *<select name="loanType" required><option value="">Select</option><option>Personal Loan</option><option>Home Loan</option><option>Home Loan Balance Transfer + Top-up</option><option>Business Loan</option><option>Loan Against Property</option><option>Vehicle Loan</option><option>Education Loan</option><option>Balance Transfer / Consolidation</option><option>Project Funds</option></select></label>
<label>How soon do you require the loan? *<select name="urgency" required><option value="">Select</option><option>Immediate</option><option>Within a week</option><option>Within a month</option><option>Next Month</option><option>After 1 month</option><option>After 2 Months</option><option>Within 3 Months</option></select></label>
<label>Any CIBIL / Credit issue? *<select name="hasCibilIssue" id="guestCibil" required><option value="">Select</option><option>No</option><option>Yes</option><option>Not sure</option></select></label>
<label id="guestCibilDetailsWrap" hidden>CIBIL / Credit details *<textarea name="cibilDetails" rows="3" maxlength="900" placeholder="Example: overdue, settlement, late payment, unknown account, score concern, or not sure about the report"></textarea></label>
<label class="consent-check"><input type="checkbox" name="consent" required> I agree that Hello Customer Fintech Solutions may contact me regarding this enquiry.</label>
<button class="btn primary" type="submit">Enter as a Guest →</button><div id="guestMsg" class="auth-message"></div></form>
</div></section></main><script src="portal-config.js"></script><script src="ui.js"></script>
<script>
const f=document.getElementById('guestForm'),q=new URLSearchParams(location.search),source=(q.get('source')||'Website').slice(0,40),ref=(q.get('ref')||'').slice(0,60),campaignId=(q.get('campaign')||'').slice(0,60),ret=(q.get('return')||'loan-rates.html').replace(/^https?:.*/i,'loan-rates.html');
const tracking=!!(ref||q.get('source')||campaignId);if(tracking){document.body.classList.add('guest-tracking');document.body.dataset.trackingMode='true';guestPublicNav.hidden=true;document.querySelector('.brand')?.removeAttribute('href')}
if(ref||source!=='Website'||campaignId){sourceBadge.hidden=false;sourceBadge.textContent='Campaign: '+source+(ref?' · '+ref:'')+(campaignId?' · '+campaignId:'')}
f.mobile.oninput=()=>f.mobile.value=f.mobile.value.replace(/\D/g,'').slice(0,10);f.pincode.oninput=()=>f.pincode.value=f.pincode.value.replace(/\D/g,'').slice(0,6);
guestCibil.onchange=()=>{const on=['Yes','Not sure'].includes(guestCibil.value);guestCibilDetailsWrap.hidden=!on;f.cibilDetails.required=on;if(!on)f.cibilDetails.value=''};
(async()=>{if(!ref)return;try{const fd=new FormData();fd.set('action','guestBranding');fd.set('ref',ref);const r=await fetch(HC_PORTAL_CONFIG.appsScriptUrl,{method:'POST',body:fd});const d=await r.json();if(d.imageUrl){guestBrandImage.src=d.imageUrl;guestBrandImage.style.display='block';guestBrandImage.alt=(d.displayName||'Campaign')+' promotion'}}catch(_){}})();
f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type=submit]'),m=guestMsg;try{if(!f.reportValidity())return;if(!/^[6-9]\d{9}$/.test(f.mobile.value))throw Error('Enter a valid 10-digit mobile number starting with 6–9.');if(!/^\d{6}$/.test(f.pincode.value))throw Error('Enter a valid 6-digit pincode.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.value))throw Error('Enter a valid email address.');if(['Yes','Not sure'].includes(f.hasCibilIssue.value)&&f.cibilDetails.value.trim().length<3)throw Error('Please add a short note about the CIBIL / credit concern.');HCUI.setLoading(b,true,'Saving details…');const fd=new FormData(f);fd.set('action','guestAccess');fd.set('source',source);fd.set('ref',ref);fd.set('campaignId',campaignId);const r=await fetch(HC_PORTAL_CONFIG.appsScriptUrl,{method:'POST',body:fd});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error('Please check with support for access issue.')}if(!d.ok)throw Error(d.error||'Unable to continue.');sessionStorage.setItem('hcGuestSession',JSON.stringify({token:d.guestToken,name:f.fullName.value,email:f.email.value,loanType:f.loanType.value,expiresAt:d.expiresAt,source,ref,campaignId}));location.replace(ret)}catch(x){HCUI.message(m,x.message||'Please check with support for access issue.','error');HCUI.setLoading(b,false)}};
</script><script src="app-shell.js"></script></body></html>
