<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social API Configuration | Hello Customer</title><link rel="stylesheet" href="style.css"></head><body class="portal-body"><header class="site-header"><div class="container nav"><a class="brand" href="admin-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="admin-dashboard.html">Dashboard</a><a href="social-publisher.html">Social Publisher</a><a href="ad-manager.html">Ad Manager</a><button class="btn primary small" id="logout">Logout</button></nav></div></header><main class="portal-main"><section class="section"><div class="container narrow"><div class="dashboard-head"><div><div class="eyebrow">Administrator only</div><h1>Social API Configuration</h1><p>Credentials are stored in Apps Script Properties, never Google Sheets or GitHub.</p></div></div><form id="cfg" class="portal-card"><h2>Meta / Facebook / Instagram</h2><label>Facebook Page ID<input name="facebookPageId"></label><label>Facebook Page Access Token<input name="facebookToken" type="password" autocomplete="off"></label><label>Instagram Professional Account ID<input name="instagramUserId"></label><h2>YouTube</h2><label>Google OAuth Access Token<input name="youtubeToken" type="password" autocomplete="off"><small>Use only a valid authorised token. For production, implement OAuth refresh-token rotation.</small></label><h2>ShareChat Partner Integration</h2><label>Official Partner API Endpoint<input name="sharechatEndpoint" type="url"></label><label>Partner API Token<input name="sharechatToken" type="password"></label><button class="btn primary" type="submit">Save Secure Configuration</button><div id="msg" class="auth-message"></div></form></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script><script>(async()=>{await HCAuth.guard({adminOnly:true});logout.onclick=HCAuth.logout;cfg.onsubmit=async e=>{e.preventDefault();const b=cfg.querySelector('button[type=submit]');HCUI.setLoading(b,true,'Saving securely…');try{await HCCRM.api('adminSaveSocialConfig',Object.fromEntries(new FormData(cfg).entries()));HCUI.message(msg,'Changes are saved successfully and the backend configuration has been updated.','ok');cfg.reset()}catch(x){HCUI.message(msg,x.message,'error')}finally{HCUI.setLoading(b,false)}}})();</script><script src="nav-shared.js"></script><script src="site-ads.js"></script></body></html>
