<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="home.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="login.html">← Login options</a></nav></div></header><main><section class="section"><div class="container auth-shell"><div><div class="eyebrow">Administrator</div><h1>Admin Login</h1><p>Restricted to authorised platform administrators.</p></div><form id="adminLoginForm" class="auth-card"><label>Admin username *<input name="username" required autocomplete="username"></label><label>Password *<div class="password-ui"><input id="adminPassword" type="password" name="password" required autocomplete="current-password"><button class="btn ghost small" type="button" data-toggle-password="adminPassword">Show</button></div></label><button class="btn primary" type="submit">Login as Admin →</button><div id="authMessage" class="auth-message"></div></form></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script>document.querySelector('[data-toggle-password]').onclick=e=>{const x=document.getElementById(e.currentTarget.dataset.togglePassword);x.type=x.type==='password'?'text':'password';e.currentTarget.textContent=x.type==='password'?'Show':'Hide'};document.getElementById('adminLoginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button[type=submit]');b.disabled=true;try{await HCAuth.adminLogin(f)}catch(x){document.getElementById('authMessage').textContent=HCAuth.friendly(x);b.disabled=false}};</script></body></html>
