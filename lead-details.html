<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Details | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="executive-dashboard.html">Dashboard</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="executive-profile.html">Profile</a></nav></div></header><main><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Lead workspace</div><h1 id="leadTitle">Lead Details</h1><p id="leadMeta">Loading…</p></div><a class="btn ghost" href="my-leads.html">← My Leads</a></div><div class="dashboard-grid"><div class="dashboard-panel" id="summary">Loading…</div><form id="updateForm" class="dashboard-panel"><h2>Update stage & status</h2><div class="fields two"><label>Stage<select name="stage" id="stage"></select></label><label>Status<select name="status" id="status"></select></label><label>Next follow-up<input type="datetime-local" name="nextFollowUp"></label><label class="full">Notes<textarea name="notes" rows="4" maxlength="2000"></textarea></label></div><button class="btn primary" type="submit">Save Update</button><div id="updateMessage" class="auth-message"></div></form></div><div class="dashboard-panel"><h2>Activity timeline</h2><form id="activityForm" class="activity-compose"><input name="note" maxlength="1000" placeholder="Add follow-up note or activity" required><button class="btn ghost" type="submit">Add Activity</button></form><div id="activities">Loading…</div></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script>(async()=>{await HCAuth.guard();const id=new URLSearchParams(location.search).get('id');if(!id){location.href='my-leads.html';return}let d;try{d=await HCCRM.getLead(id)}catch(e){document.getElementById('leadMeta').textContent=e.message;return}const esc=HCCRM.esc;document.getElementById('extraLeadDetails')&&(document.getElementById('extraLeadDetails').innerHTML=[['Phone',lead.mobile],['Email',lead.email],['Address',lead.address],['Salary',lead.salary],['Designation',lead.designation],['Pincode',lead.pincode],['Comments',lead.comments]].map(x=>`<div class="lead-field"><span>${HCCRM.esc(x[0])}</span><b>${HCCRM.esc(x[1]||'—')}</b></div>`).join(''));document.getElementById('leadTitle').textContent=d.customerName||id;document.getElementById('leadMeta').textContent=id+' · '+(d.loanType||'Loan enquiry');function summary(){document.getElementById('summary').innerHTML=`<h2>Customer & requirement</h2><div class="lead-facts"><p><b>Lead ID</b><span>${esc(id)}</span></p><p><b>Customer</b><span>${esc(d.customerName||'')}</span></p><p><b>Mobile</b><span>${esc(d.mobile||'')}</span></p><p><b>Email</b><span>${esc(d.email||'—')}</span></p><p><b>Loan Type</b><span>${esc(d.loanType||'')}</span></p><p><b>Loan Amount</b><span>${d.loanAmount?new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(d.loanAmount):'—'}</span></p><p><b>Purpose</b><span>${esc(d.purpose||'—')}</span></p><p><b>Source</b><span>${esc(d.source||'—')}</span></p><p><b>Stage</b><span>${esc(d.stage||'Enquiry')}</span></p><p><b>Status</b><span>${esc(d.status||'New')}</span></p></div>`}summary();const f=document.getElementById('updateForm');HCCRM.stages.forEach(x=>f.stage.insertAdjacentHTML('beforeend',`<option>${x}</option>`));HCCRM.statuses.forEach(x=>f.status.insertAdjacentHTML('beforeend',`<option>${x}</option>`));f.stage.value=d.stage||'Enquiry';f.status.value=d.status||'New';f.nextFollowUp.value=d.nextFollowUp||'';f.notes.value=d.notes||'';f.onsubmit=async ev=>{ev.preventDefault();try{await HCCRM.updateLead(id,{stage:f.stage.value,status:f.status.value,nextFollowUp:f.nextFollowUp.value,comments:f.comments?.value||'',notes:f.notes.value.trim()});d={...d,stage:f.stage.value,status:f.status.value,nextFollowUp:f.nextFollowUp.value,comments:f.comments?.value||'',notes:f.notes.value.trim()};summary();const m=document.getElementById('updateMessage');m.textContent='Lead updated successfully.';m.className='auth-message ok';await renderActivities()}catch(x){document.getElementById('updateMessage').textContent=x.message}};const af=document.getElementById('activityForm');af.onsubmit=async ev=>{ev.preventDefault();await HCCRM.addActivity(id,'Note',af.note.value);af.reset();await renderActivities()};async function renderActivities(){const a=await HCCRM.activities(id);document.getElementById('activities').innerHTML=a.length?a.map(x=>`<div class="timeline-item"><b>${esc(x.type||'Activity')}</b><span>${esc(x.note||'')}</span><small>${x.executiveId?esc(x.executiveId)+' · ':''}${esc(x.createdAt||'')}</small></div>`).join(''):'<p class="muted">No activities yet.</p>'}await renderActivities()})();</script><script src="nav-shared.js"></script></body></html>
