<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Details | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="lead-queue.html">Assigned Queue</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a><a href="executive-profile.html">Profile</a><button class="btn primary small" id="logout">Logout</button></nav></div></header><main class="portal-main"><section class="section"><div class="container"><div class="dashboard-head"><div><div class="eyebrow">Lead workspace</div><h1 id="leadTitle">Lead Details</h1><p id="leadMeta">Loading…</p></div><div class="dashboard-actions"><a id="analysisBtn" class="btn primary" href="#" hidden>Calculate</a><a class="btn ghost" href="my-leads.html">← Leads</a></div></div><div class="dashboard-grid"><div class="dashboard-panel" id="summary">Loading…</div><form id="updateForm" class="dashboard-panel"><h2>Update lead</h2><div class="fields two"><label>Stage<select name="stage"></select></label><label>Status<select name="status"></select></label><label>Next Follow-up Date<input type="date" name="followUpDate"></label><label>Suitable Time<select name="followUpTimeBand"><option value="">Select</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label><label class="full">Comments<textarea name="comments" rows="3" maxlength="1500"></textarea></label><label class="full">Internal Notes<textarea name="notes" rows="4" maxlength="2000"></textarea></label></div><button class="btn primary" type="submit">Save Update</button><div id="updateMessage" class="auth-message"></div></form></div><div class="dashboard-panel"><h2>Activity timeline</h2><form id="activityForm" class="activity-compose"><input name="note" maxlength="1000" placeholder="Add follow-up note or activity" required><button class="btn ghost" type="submit">Add Activity</button></form><div id="activities">Loading…</div></div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script src="crm.js"></script><script src="ui.js"></script>
<script>(async()=>{const {profile}=await HCAuth.guard();logout.onclick=HCAuth.logout;const id=new URLSearchParams(location.search).get('id');if(!id){location.replace('my-leads.html');return}if(profile.role==='admin'||profile.permissions?.loanAnalysis===true){analysisBtn.hidden=false;analysisBtn.href='lead-analysis.html?id='+encodeURIComponent(id)}let d;try{d=await HCCRM.getLead(id)}catch(e){leadMeta.textContent=e.message;summary.innerHTML='<div class="empty-state"><h3>Lead unavailable</h3><p>'+HCCRM.esc(e.message)+'</p></div>';return}const esc=HCCRM.esc;leadTitle.textContent=d.customerName||id;leadMeta.textContent=id+' · '+(d.loanType||'Loan enquiry');
function money(v){return typeof v==='number'&&v?new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v):esc(v||'—')}
function summaryRender(){summary.innerHTML=`<h2>Customer & requirement</h2><div class="lead-facts"><p><b>Lead ID</b><span>${esc(id)}</span></p><p><b>Customer</b><span>${esc(d.customerName||'')}</span></p><p><b>Mobile</b><span>${esc(d.mobile||'')}</span></p><p><b>Email</b><span>${esc(d.email||'—')}</span></p><p><b>Address</b><span>${esc(d.address||'—')}</span></p><p><b>Pincode</b><span>${esc(d.pincode||'—')}</span></p><p><b>Profile</b><span>${esc(d.employment||'—')}</span></p><p><b>Designation</b><span>${esc(d.designation||'—')}</span></p><p><b>Income / Salary</b><span>${money(d.salary)}</span></p><p><b>Loan Type</b><span>${esc(d.loanType||'')}</span></p><p><b>Loan Amount</b><span>${money(d.loanAmount)}</span></p><p><b>Purpose</b><span>${esc(d.purpose||'—')}</span></p><p><b>Existing EMIs</b><span>${esc(d.hasEmis||'—')} ${d.emiCount?'('+d.emiCount+')':''}</span></p><p><b>Credit Cards</b><span>${esc(d.hasCreditCards||'—')} ${d.creditCardCount?'('+d.creditCardCount+')':''}</span></p><p><b>Credit Card EMI</b><span>${money(d.totalCreditCardEmi||0)}</span></p><p><b>Credit Card Outstanding</b><span>${money(d.totalCreditCardOutstanding||0)}</span></p><p><b>CIBIL / Credit Issue</b><span>${esc(d.hasCibilIssue||'—')}</span></p><p><b>Source</b><span>${esc([d.source,d.sourceRef].filter(Boolean).join(' · ')||'—')}</span></p><p><b>Assigned To</b><span>${esc(d.assignedToExecutiveId||'Unassigned')}</span></p><p><b>Stage</b><span>${esc(d.stage||'Enquiry')}</span></p><p><b>Status</b><span>${esc(d.status||'New')}</span></p></div>${d.cibilDetails?`<div class="notice"><b>CIBIL details:</b> ${esc(d.cibilDetails)}</div>`:''}${d.comments?`<div class="notice"><b>Latest comments:</b> ${esc(d.comments)}</div>`:''}`}
summaryRender();const f=updateForm;HCCRM.stages.forEach(x=>f.stage.add(new Option(x,x)));HCCRM.statuses.forEach(x=>f.status.add(new Option(x,x)));f.stage.value=d.stage||'Enquiry';f.status.value=d.status||'New';const fu=String(d.nextFollowUp||'').split(' | ');f.followUpDate.value=(fu[0]||'').slice(0,10);f.followUpTimeBand.value=d.followUpTimeBand||fu[1]||'';f.comments.value=d.comments||'';f.notes.value=d.notes||'';
f.onsubmit=async ev=>{ev.preventDefault();const b=f.querySelector('button[type=submit]');HCUI.setLoading(b,true,'Saving…');try{const next=[f.followUpDate.value,f.followUpTimeBand.value].filter(Boolean).join(' | ');await HCCRM.updateLead(id,{stage:f.stage.value,status:f.status.value,nextFollowUp:next,followUpTimeBand:f.followUpTimeBand.value,comments:f.comments.value.trim(),notes:f.notes.value.trim()});d={...d,stage:f.stage.value,status:f.status.value,nextFollowUp:next,followUpTimeBand:f.followUpTimeBand.value,comments:f.comments.value.trim(),notes:f.notes.value.trim()};summaryRender();HCUI.message(updateMessage,'Updated.','ok');await renderActivities()}catch(x){HCUI.message(updateMessage,x.message||'Unable to save changes.','error')}finally{HCUI.setLoading(b,false)}};
activityForm.onsubmit=async ev=>{ev.preventDefault();const b=activityForm.querySelector('button');HCUI.setLoading(b,true,'Saving…');try{await HCCRM.addActivity(id,'Note',activityForm.note.value);activityForm.reset();await renderActivities()}finally{HCUI.setLoading(b,false)}};async function renderActivities(){const a=await HCCRM.activities(id);activities.innerHTML=a.length?a.map(x=>`<div class="timeline-item"><b>${esc(x.type||'Activity')}</b><span>${esc(x.note||'')}</span><small>${x.executiveId?esc(x.executiveId)+' · ':''}${esc(x.createdAt||'')}</small></div>`).join(''):'<p class="muted">No activities yet.</p>'}await renderActivities()})();</script><script src="nav-shared.js"></script><script src="site-ads.js"></script><script src="app-shell.js"></script></body></html>
