<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Profile | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav><a href="executive-dashboard.html">Dashboard</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a></nav></div></header><main><section class="section"><div class="container narrow"><div class="dashboard-head"><div><div class="eyebrow">My Account</div><h1>Executive Profile</h1></div><a class="btn ghost" href="executive-dashboard.html">← Dashboard</a></div><div class="profile-card"><div id="profileHeader"></div><form id="profileForm" class="profile-edit"><div class="fields two"><label>Full name *<input name="fullName" required maxlength="120"></label><label>Mobile *<input name="mobile" required maxlength="10" inputmode="numeric"></label><label class="full">Change profile photo<input type="file" name="profilePhoto" accept="image/jpeg,image/png,image/webp"></label></div><button class="btn primary" type="submit">Save Profile</button><div id="profileMessage" class="auth-message"></div><a class="btn ghost" href="change-password.html">Change Password</a></form><hr><p><a href="forgot-password.html">Reset / change password securely →</a></p></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js"></script><script>(async()=>{if(!HCAuth.ready)return;let {profile}=await HCAuth.guard();const h=document.getElementById('profileHeader'),f=document.getElementById('profileForm');function render(){h.innerHTML=`${profile.photoURL?`<img class="profile-photo" src="${profile.photoURL}" alt="Profile photo">`:'<div class="profile-photo placeholder">Photo</div>'}<h2>${profile.fullName||''}</h2><div class="profile-meta"><span><b>Executive ID:</b> ${profile.executiveId||'Pending'}</span><span><b>Username:</b> ${profile.username||''}</span><span><b>Role:</b> ${profile.role||''}</span><span><b>Email:</b> ${profile.email||''}</span><span><b>Status:</b> ${profile.status||''}</span></div>`;f.fullName.value=profile.fullName||'';f.mobile.value=profile.mobile||''}render();f.mobile.addEventListener('input',()=>f.mobile.value=f.mobile.value.replace(/\D/g,'').slice(0,10));f.addEventListener('submit',async e=>{e.preventDefault();try{const u=await HCAuth.updateProfile({fullName:f.fullName.value,mobile:f.mobile.value,photoFile:f.profilePhoto.files[0]});profile={...profile,...u};render();const m=document.getElementById('profileMessage');m.textContent='Profile updated.';m.className='auth-message ok'}catch(x){document.getElementById('profileMessage').textContent=x.message}})})();</script></body></html>
