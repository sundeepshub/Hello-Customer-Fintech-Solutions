<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Profile | Hello Customer Fintech Solutions</title><link rel="stylesheet" href="style.css"></head><body class="portal-body"><div id="hcPageLoader" class="page-loader"><div class="page-loader-card"><span class="page-loader-spinner"></span><b>Loading…</b><small>Please wait</small></div></div><header class="site-header"><div class="container nav"><a class="brand" href="executive-dashboard.html"><span class="brand-mark">HC</span><span><strong>Hello Customer</strong><small>FINTECH SOLUTIONS</small></span></a><nav class="portal-nav"><a href="executive-dashboard.html">Dashboard</a><a href="my-leads.html">My Leads</a><a href="new-lead.html">Add Lead</a></nav></div></header><main><section class="section"><div class="container narrow"><div class="dashboard-head"><div><div class="eyebrow">My Account</div><h1>Executive Profile</h1></div><a class="btn ghost" href="executive-dashboard.html">← Dashboard</a></div><div class="profile-card"><div id="profileHeader"></div><form id="profileForm" class="profile-edit"><div class="fields two"><label>Full name *<input name="fullName" required maxlength="120"></label><label>Mobile *<input name="mobile" required maxlength="10" inputmode="numeric"></label><label class="full">Change profile photo<input type="file" name="profilePhoto" accept="image/jpeg,image/png,image/webp"><small>Upload JPG, PNG or WEBP up to 3 MB.</small></label></div><div id="nomineeSection" class="profile-subsection" hidden><div class="section-head"><div><h3 data-help="Nominee details are profile reference information. Whether they are shown or required is controlled by the administrator.">Nominee Details</h3><p class="muted" id="nomineeHint">Optional profile information.</p></div></div><div class="fields two"><label>Nominee Name<input name="nomineeName" maxlength="120"></label><label>Relationship<select name="nomineeRelationship"><option value="">Select relationship</option><option>Spouse</option><option>Father</option><option>Mother</option><option>Son</option><option>Daughter</option><option>Brother</option><option>Sister</option><option>Other</option></select></label><label>Nominee Mobile<input name="nomineeMobile" maxlength="10" inputmode="numeric"></label><label>Nominee Email<input name="nomineeEmail" type="email" maxlength="160"></label></div></div><button class="btn primary" type="submit">Save Profile</button><div id="profileMessage" class="auth-message"></div><a class="btn ghost" href="change-password.html">Change Password</a></form></div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script><script src="portal-config.js"></script><script src="auth.js"></script><script>(async()=>{let {profile}=await HCAuth.guard();const h=document.getElementById('profileHeader'),f=document.getElementById('profileForm'),ns=document.getElementById('nomineeSection'),nh=document.getElementById('nomineeHint');function render(){h.innerHTML=`${profile.photoURL?`<img class="profile-photo" src="${profile.photoURL}" alt="Profile photo">`:'<div class="profile-photo placeholder">Photo</div>'}<h2>${profile.fullName||''}</h2><div class="profile-meta"><span><b>Executive ID:</b> ${profile.executiveId||'Pending'}</span><span><b>Username:</b> ${profile.username||''}</span><span><b>Role:</b> ${profile.role||''}</span><span><b>Email:</b> ${profile.email||''}</span><span><b>Status:</b> ${profile.status||''}</span></div>`;f.fullName.value=profile.fullName||'';f.mobile.value=profile.mobile||'';const cfg=profile.nomineeConfig||{visible:true,required:false};ns.hidden=!cfg.visible;if(cfg.visible){f.nomineeName.value=profile.nomineeName||'';f.nomineeRelationship.value=profile.nomineeRelationship||'';f.nomineeMobile.value=profile.nomineeMobile||'';f.nomineeEmail.value=profile.nomineeEmail||'';['nomineeName','nomineeRelationship','nomineeMobile'].forEach(n=>f[n].required=!!cfg.required);nh.textContent=cfg.required?'Nominee name, relationship and mobile are required by administrator setting.':'Nominee details are optional.'}}render();f.mobile.oninput=()=>f.mobile.value=f.mobile.value.replace(/\D/g,'').slice(0,10);f.nomineeMobile.oninput=()=>f.nomineeMobile.value=f.nomineeMobile.value.replace(/\D/g,'').slice(0,10);f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button[type=submit]');if(window.HCUI)HCUI.setLoading(b,true,'Updating…');try{profile=await HCAuth.updateProfile({fullName:f.fullName.value,mobile:f.mobile.value,photoFile:f.profilePhoto.files[0],nomineeName:f.nomineeName.value,nomineeRelationship:f.nomineeRelationship.value,nomineeMobile:f.nomineeMobile.value,nomineeEmail:f.nomineeEmail.value});render();const m=document.getElementById('profileMessage');m.textContent='Updated.';m.className='auth-message ok'}catch(x){const m=document.getElementById('profileMessage');m.textContent=x.message;m.className='auth-message error'}finally{if(window.HCUI)HCUI.setLoading(b,false)}}})();</script><script src="nav-shared.js"></script><script src="ui.js"></script><script src="site-ads.js"></script><script src="app-shell.js"></script></body></html>
